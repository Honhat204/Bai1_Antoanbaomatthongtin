<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Permutation Cipher — Hoán vị (cập nhật parse khóa)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body{font-family:system-ui, Arial; background:#f3f7fb; padding:18px}
  .card{max-width:820px;margin:12px auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 8px 24px rgba(10,20,40,0.06)}
  textarea, input {width:100%;padding:10px;border-radius:8px;border:1px solid #dbe7f3;margin-top:8px;box-sizing:border-box;font-size:14px}
  label{font-weight:600;margin-top:10px;display:block}
  .row{display:flex;gap:10px;margin-top:12px}
  button{padding:10px 14px;border-radius:8px;border:0;background:#0366d6;color:#fff;cursor:pointer;transition:0.15s}
  button.ghost{background:#eef4ff;color:#0366d6}
  button.active{background:#28a745 !important; color:#fff !important}
  pre{background:#f6fbff;padding:12px;border-radius:8px;white-space:pre-wrap}
  .small{font-size:13px;color:#65748b;margin-top:8px}
  .err{color:#b91c1c;font-weight:700}
  .ok{color:#0f9d58;font-weight:700}
  .meta{margin-top:8px;font-size:13px;color:#475569}
</style>
</head>
<body>
  <div class="card">
    <h2>Permutation cipher — Hoán vị (hỗ trợ nhiều dạng khóa)</h2>

    <label>Văn bản (nhập bản rõ để mã hóa hoặc nhập bản mã để giải mã):</label>
    <textarea id="text" rows="5" placeholder="Nhập văn bản ở đây..."></textarea>

    <label>Khóa (hỗ trợ 3 dạng):</label>
    <ul style="margin:6px 0 0 18px">
      <li><small>Khóa số 1-based: <code>3,1,4,2</code> hoặc <code>3 1 4 2</code></small></li>
      <li><small>Khóa số 0-based (tự chuyển sang 1-based): <code>0,2,1</code></small></li>
      <li><small>Khóa chữ (word): <code>ZEBRA</code> → sẽ chuyển thành hoán vị theo thứ tự chữ cái</small></li>
    </ul>
    <input id="key" placeholder="Ví dụ: 3,1,4,2  hoặc  ZEBRA" value="3,1,4,2" />

    <div class="row" style="margin-top:10px">
      <button id="btnEncrypt" onclick="doEncrypt()">Mã hóa</button>
      <button id="btnDecrypt" class="ghost" onclick="doDecrypt()">Giải mã</button>
      <button class="ghost" onclick="autoFillSample()">Mẫu</button>
    </div>

    <div class="meta" id="meta"></div>

    <label style="margin-top:12px">Kết quả:</label>
    <pre id="result">—</pre>
    <div class="small">Lưu ý: block cuối nếu thiếu sẽ được padding bằng 'X'.</div>
  </div>

<script>
/* --------- Key parsing & validation ---------- */

/* parse nhập: nếu chứa chữ, trả về dạng word key; nếu chứa số, parse dãy số */
function parseKeyRaw(s){
  if(!s || s.trim().length===0) return { ok:false, reason:'Khóa rỗng' };
  // detect if contains any letter
  if(/[A-Za-z]/.test(s)){
    // lấy các ký tự chữ (không loại bỏ duplicate — duplicates allowed in word but we need unique positions)
    // ta coi mỗi ký tự như cột; ví dụ "ZEBRA" -> ['Z','E','B','R','A']
    let arr = [];
    for(let ch of s){
      if(/[A-Za-z]/.test(ch)) arr.push(ch);
    }
    if(arr.length===0) return { ok:false, reason:'Không tìm ký tự chữ hợp lệ trong khóa' };
    return { ok:true, type:'word', data: arr };
  } else {
    // parse numbers (0-based or 1-based)
    let nums = s.split(/[^0-9]+/).filter(x=>x.length>0).map(x=>parseInt(x,10));
    if(nums.length===0) return { ok:false, reason:'Không tìm số hợp lệ trong khóa' };
    return { ok:true, type:'nums', data: nums };
  }
}

/* build permutation (1-based array) from raw parse */
function buildPermutation(parsed){
  if(!parsed.ok) return { ok:false, reason: parsed.reason };

  if(parsed.type === 'word'){
    let arr = parsed.data;
    // Normalise letters to lower for comparison, but preserve original index to break ties
    let pairs = arr.map((ch, idx)=>({ch: ch.toLowerCase(), idx}));
    // sort by char then by original index
    let sorted = pairs.slice().sort((a,b) => (a.ch < b.ch ? -1 : a.ch > b.ch ? 1 : a.idx - b.idx));
    // assign rank 1..n for sorted order (if repeated letters, ranks increase left-to-right)
    let n = arr.length;
    let rank = new Array(n);
    for(let r=0;r<n;r++){
      let origIndex = sorted[r].idx;
      rank[origIndex] = r+1; // 1-based rank
    }
    return { ok:true, perm: rank }; // perm[j] = rank of column j (1..n)
  }

  if(parsed.type === 'nums'){
    let nums = parsed.data.slice();
    // detect if 0-based: if min == 0 and max == n-1 -> convert +1
    let min = Math.min(...nums), max = Math.max(...nums);
    if(min === 0 && max === nums.length - 1){
      nums = nums.map(x => x + 1);
    }
    // Now we expect numbers in 1..n but could also be a permutation of other numbers -> validate
    // If they are not in 1..n, we can attempt to reindex: e.g. user gives [3,5,2] (not 1..3), we reject.
    let n = nums.length;
    // validate all integers
    for(let v of nums) if(!Number.isInteger(v)) return { ok:false, reason: 'Khóa chứa giá trị không phải số nguyên' };
    // check in range 1..n
    for(let v of nums) if(v < 1 || v > n) return { ok:false, reason: `Các số phải nằm trong khoảng 1..${n}` };
    // check duplicates
    let seen = new Array(n+1).fill(false);
    for(let v of nums){
      if(seen[v]) return { ok:false, reason: 'Khóa chứa số lặp' };
      seen[v] = true;
    }
    // good
    return { ok:true, perm: nums };
  }

  return { ok:false, reason:'Lỗi parse không xác định' };
}

/* ---------- encryption / decryption ---------- */

function encryptPermutation(text, keyPerm, pad='X'){
  let n = keyPerm.length;
  let out = '';
  for(let i=0;i<text.length;i+=n){
    let block = text.slice(i, i+n);
    if(block.length < n) block = block + pad.repeat(n - block.length);
    let enc = new Array(n);
    for(let j=0;j<n;j++){
      // keyPerm[j] is 1-based index in original block that moves to position j
      enc[j] = block[keyPerm[j]-1];
    }
    out += enc.join('');
  }
  return out;
}

function decryptPermutation(cipher, keyPerm){
  let n = keyPerm.length;
  let inv = new Array(n);
  for(let j=0;j<n;j++) inv[keyPerm[j]-1] = j;
  let out = '';
  for(let i=0;i<cipher.length;i+=n){
    let block = cipher.slice(i, i+n);
    if(block.length < n) block = block + 'X'.repeat(n - block.length);
    let dec = new Array(n);
    for(let j=0;j<n;j++){
      dec[j] = block[inv[j]];
    }
    out += dec.join('');
  }
  return out;
}

/* ---------- UI helpers ---------- */

function showMeta(msg, ok){
  let el = document.getElementById('meta');
  if(ok) el.innerHTML = `<span class="ok">${msg}</span>`;
  else el.innerHTML = `<span class="err">${msg}</span>`;
}
function showResult(s){ document.getElementById('result').innerText = s; }

function setActive(buttonId){
  document.getElementById("btnEncrypt").classList.remove("active");
  document.getElementById("btnDecrypt").classList.remove("active");
  document.getElementById(buttonId).classList.add("active");
}

/* perform parse and return perm or show error */
function getPermutationFromInput(){
  let keyStr = document.getElementById('key').value;
  let parsed = parseKeyRaw(keyStr);
  let built = buildPermutation(parsed);
  if(!built.ok){
    showMeta('Khóa không hợp lệ: ' + built.reason, false);
    return null;
  }
  showMeta('Khóa hợp lệ — hoán vị (1-based): [' + built.perm.join(',') + ']', true);
  return built.perm;
}

/* actions */
function doEncrypt(){
  setActive("btnEncrypt");
  let text = document.getElementById('text').value;
  if(text.length===0){ showResult('Vui lòng nhập văn bản.'); return; }
  let perm = getPermutationFromInput();
  if(!perm) { showResult('Không thể mã hóa do khóa không hợp lệ.'); return; }
  let cipher = encryptPermutation(text, perm);
  showResult(cipher);
}
function doDecrypt(){
  setActive("btnDecrypt");
  let text = document.getElementById('text').value;
  if(text.length===0){ showResult('Vui lòng nhập văn bản.'); return; }
  let perm = getPermutationFromInput();
  if(!perm) { showResult('Không thể giải mã do khóa không hợp lệ.'); return; }
  let plain = decryptPermutation(text, perm);
  showResult(plain);
}

/* autofill sample keys for testing */
function autoFillSample(){
  document.getElementById('key').value = 'ZEBRA';
  document.getElementById('text').value = 'HELLOWORLD';
  showMeta('', false);
  showResult('Bạn đã điền mẫu. Bấm Mã hóa để thử.');
}
</script>
</body>
</html>
